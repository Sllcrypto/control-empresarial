function fmtDate(d){if(!d)return"—";const[y,m,day]=d.split("-");return`${day}/${m}/${y}`;}
function fmtHora(ts){if(!ts)return"—";return new Date(ts).toLocaleTimeString("es-CR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});}
function fmtFecha(ts){if(!ts)return"—";return new Date(ts).toLocaleDateString("es-CR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function pasado(ts){return(Date.now()-ts)>LIMITE_CAFE*60*1000;}
function durToMin(dur){
  if(!dur)return 0;
  const s=dur.trim().toLowerCase();
  let total=0;
  // Formatos: "2h 30min", "2h30m", "1h", "30min", "30m", "90", "1:30"
  const hMatch=s.match(/(\d+)\s*h/);
  const mMatch=s.match(/(\d+)\s*m(?:in)?(?!\s*\d)/);
  const colonMatch=s.match(/^(\d+):(\d+)$/);
  if(colonMatch){
    total=parseInt(colonMatch[1])*60+parseInt(colonMatch[2]);
  } else {
    if(hMatch)total+=parseInt(hMatch[1])*60;
    if(mMatch)total+=parseInt(mMatch[1]);
    if(!hMatch&&!mMatch&&!isNaN(parseInt(s)))total=parseInt(s);
  }
  return total;
}
function minToDur(min){
  if(min<=0)return"0min";
  const h=Math.floor(min/60);const m=min%60;
  if(h>0&&m>0)return`${h}h ${m}min`;
  if(h>0)return`${h}h`;
  return`${m}min`;
}

function semanaLunes(fecha){
  const dt=new Date(fecha);dt.setHours(0,0,0,0);
  const day=dt.getDay();const diff=day===0?-6:1-day;
  dt.setDate(dt.getDate()+diff);
  return dt.toISOString().split("T")[0];
}
function minutosEntre(h1,h2){
  if(!h1||!h2)return 0;
  const[a1,b1]=h1.split(":").map(Number);const[a2,b2]=h2.split(":").map(Number);
  const m=(a2*60+b2)-(a1*60+b1);
  return m>0?m:0;
}
function grupoTempranoDeSemana(cfg,fechaRef){
  const lunesActual=semanaLunes(fechaRef||new Date());
  const msSemana=7*24*60*60*1000;
  const diffSemanas=Math.round((new Date(lunesActual+"T00:00:00")-new Date(cfg.semanaAncla+"T00:00:00"))/msSemana);
  const esPar=((diffSemanas%2)+2)%2===0;
  const otro=cfg.grupoTempranoAncla==="grupo1"?"grupo2":"grupo1";
  return esPar?cfg.grupoTempranoAncla:otro;
}
function horarioDeGrupo(cfg,grupoId,fechaRef){
  const temprano=grupoTempranoDeSemana(cfg,fechaRef)===grupoId;
  return temprano
    ?{tipo:"Temprano",lv:{entrada:cfg.lvTempranoEntrada,salida:cfg.lvTempranoSalida},sab:{entrada:cfg.sabTempranoEntrada,salida:cfg.sabTempranoSalida},sabAlmuerzo:{entrada:cfg.sabAlmTempranoInicio,salida:cfg.sabAlmTempranoFin}}
    :{tipo:"Tarde",lv:{entrada:cfg.lvTardeEntrada,salida:cfg.lvTardeSalida},sab:{entrada:cfg.sabTardeEntrada,salida:cfg.sabTardeSalida},sabAlmuerzo:{entrada:cfg.sabAlmTardeInicio,salida:cfg.sabAlmTardeFin}};
}
const DIAS_SEMANA = [["lun","Lunes"],["mar","Martes"],["mie","Miércoles"],["jue","Jueves"],["vie","Viernes"],["sab","Sábado"]];
function horasSemanalesColab(c,cfg){
  if(!c.grupoHorario)return null;
  if(c.grupoHorario==="especial"){
    const dias=c.horarioEspecialDias||{};
    const almLvMin=(c.almuerzoInicio&&c.almuerzoFin)?minutosEntre(c.almuerzoInicio,c.almuerzoFin):0;
    const almSabMin=(cfg.sabAlmEspecialInicio&&cfg.sabAlmEspecialFin)?minutosEntre(cfg.sabAlmEspecialInicio,cfg.sabAlmEspecialFin):0;
    let total=0,algunDia=false;
    ["lun","mar","mie","jue","vie"].forEach(d=>{
      const dia=dias[d];
      if(dia&&dia.entrada&&dia.salida){algunDia=true;total+=Math.max(0,minutosEntre(dia.entrada,dia.salida)-almLvMin);}
    });
    if(dias.sab&&dias.sab.entrada&&dias.sab.salida){algunDia=true;total+=Math.max(0,minutosEntre(dias.sab.entrada,dias.sab.salida)-almSabMin);}
    if(algunDia)return +(total/60).toFixed(2);
    return c.horarioEspecialHoras?Number(c.horarioEspecialHoras):null; // respaldo manual si no se llenó la cuadrícula
  }
  if(c.grupoHorario!=="grupo1"&&c.grupoHorario!=="grupo2")return null;
  const h=horarioDeGrupo(cfg,c.grupoHorario);
  const lvMin=minutosEntre(h.lv.entrada,h.lv.salida)*5;
  const almLvMin=(c.almuerzoInicio&&c.almuerzoFin)?minutosEntre(c.almuerzoInicio,c.almuerzoFin)*5:0;
  const sabBrutoMin=minutosEntre(h.sab.entrada,h.sab.salida);
  const almSabMin=minutosEntre(h.sabAlmuerzo.entrada,h.sabAlmuerzo.salida);
  const sabMin=sabBrutoMin-almSabMin;
  const total=lvMin-almLvMin+sabMin;
  return +(total/60).toFixed(2);
}
function fmtRangoSemana(lunesStr){
  const lunes=new Date(lunesStr+"T00:00:00");
  const sab=new Date(lunes);sab.setDate(lunes.getDate()+5);
  const f=d=>`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
  return `${f(lunes)} – ${f(sab)}`;
}

  function generarInformeFeriadoTexto(){
    const conRegistro=informeFeriadoTodos.filter(a=>a.entrada||a.salida);
    let cuerpo=`Informe general de asistencia en feriados\n\n`;
    if(conRegistro.length===0){
      cuerpo+="Sin registros de asistencia en feriados todavía.\n";
      return {asunto:"Informe de asistencia en feriados",cuerpo};
    }
    // Agrupar por fecha
    const porFecha={};
    conRegistro.forEach(a=>{(porFecha[a.fecha]=porFecha[a.fecha]||[]).push(a);});
    const fechas=Object.keys(porFecha).sort().reverse();
    fechas.forEach(fecha=>{
      const regs=porFecha[fecha];
      const nombre=regs[0].feriadoNombre||"(sin nombre)";
      cuerpo+=`── ${fecha} — ${nombre} ──\n`;
      regs.forEach(a=>{
        const c=colabs.find(x=>x.id===a.colabId);
        const h=horasFeriado(a);
        cuerpo+=`• ${c?.nombre||"—"} — Entrada: ${a.entrada||"(sin marcar)"} · Salida: ${a.salida||"(sin marcar)"} · Almuerzo: ${a.almuerzoRestado?"sí (-1h)":"no"} · Horas: ${h!==null?h+"h":"—"}\n`;
      });
      cuerpo+="\n";
    });

  }

  async function copiarInformeFeriado(texto){
    try{
      await navigator.clipboard.writeText(texto);
      setInformeFeriadoCopiado(true);setTimeout(()=>setInformeFeriadoCopiado(false),2500);
    }catch{
      // Respaldo para navegadores/webviews donde falla la API de portapapeles
      const ta=document.createElement("textarea");
      ta.value=texto;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.focus();ta.select();
      try{document.execCommand("copy");setInformeFeriadoCopiado(true);setTimeout(()=>setInformeFeriadoCopiado(false),2500);}catch{}
      document.body.removeChild(ta);
    }
  }
  function generarInformeFeriadoHTML(grupos){
    let html=`<div style="font-family:Arial,sans-serif;">`;
    grupos.forEach(g=>{
      html+=`<h3 style="margin:16px 0 6px;">${g.fecha} — ${g.nombre}</h3>`;
      html+=`<table style="border-collapse:collapse;width:100%;font-size:13px;"><thead><tr style="background:#eee;">`;
      html+=`<th style="border:1px solid #ccc;padding:6px 8px;text-align:left;">Colaborador</th>`;
      html+=`<th style="border:1px solid #ccc;padding:6px 8px;">Entrada</th>`;
      html+=`<th style="border:1px solid #ccc;padding:6px 8px;">Salida</th>`;
      html+=`<th style="border:1px solid #ccc;padding:6px 8px;">Almuerzo</th>`;
      html+=`<th style="border:1px solid #ccc;padding:6px 8px;">Horas</th></tr></thead><tbody>`;
      g.registros.forEach(r=>{
        html+=`<tr><td style="border:1px solid #ccc;padding:6px 8px;">${r.colabNombre}</td>`;
        html+=`<td style="border:1px solid #ccc;padding:6px 8px;text-align:center;">${r.entrada||"—"}</td>`;
        html+=`<td style="border:1px solid #ccc;padding:6px 8px;text-align:center;">${r.salida||"—"}</td>`;
        html+=`<td style="border:1px solid #ccc;padding:6px 8px;text-align:center;">${r.almuerzoRestado?"-1h":"—"}</td>`;
        html+=`<td style="border:1px solid #ccc;padding:6px 8px;text-align:center;font-weight:bold;">${r.horas!==null?r.horas+"h":"—"}</td></tr>`;
      });
      html+=`</tbody></table>`;
    });
    html+=`</div>`;
    return html;
  }
  async function copiarInformeFeriadoConFormato(grupos,textoPlano){
    const html=generarInformeFeriadoHTML(grupos);
    try{
      const item=new ClipboardItem({
        "text/html":new Blob([html],{type:"text/html"}),
        "text/plain":new Blob([textoPlano],{type:"text/plain"}),
      });
      await navigator.clipboard.write([item]);
      setInformeFeriadoCopiadoHTML(true);setTimeout(()=>setInformeFeriadoCopiadoHTML(false),2500);
    }catch{
      // Si el navegador no soporta copiar HTML, cae al copiado de texto plano normal
      copiarInformeFeriado(textoPlano);
    }

                            <button onClick={()=>{setColabForm({nombre:c.nombre,area:c.area,diasAcumulados:c.diasAcumulados,telefono:c.telefono||"",grupoHorario:c.grupoHorario||"",almuerzoInicio:c.almuerzoInicio||"",almuerzoFin:c.almuerzoFin||"",horarioEspecialDetalle:c.horarioEspecialDetalle||"",horarioEspecialHoras:c.horarioEspecialHoras||"",horarioEspecialDias:c.horarioEspecialDias||{}});setColabEdit(c.id);setShowColabForm(true);setAsignRapida({entrada:"",salida:"",dias:{lun:false,mar:false,mie:false,jue:false,vie:false,sab:false}});}} style={{padding:"4px 7px",borderRadius:6,border:`1px solid ${C.g3}`,background:C.g2,cursor:"pointer",fontSize:12}}>✏️</button>
                            <button onClick={()=>setDelConfirm({type:"colab",id:c.id})} style={{padding:"4px 7px",borderRadius:6,border:`1px solid ${C.g3}`,background:C.g2,cursor:"pointer",fontSize:12}}>🗑️</button>
                          </div>
                          {exp&&(
                            <div style={{borderTop:`1px solid ${C.g2}`,padding:"14px",background:"#0D1117"}}>

                                <button onClick={()=>waVacaciones(c)} style={{padding:"7px 12px",borderRadius:8,border:"none",background:"#25D366",color:C.blanco,fontSize:12,fontWeight:700,cursor:"pointer"}}>📲 WA Vacaciones</button>
                                <button onClick={()=>waPermisos(c)} style={{padding:"7px 12px",borderRadius:8,border:"none",background:"#128C7E",color:C.blanco,fontSize:12,fontWeight:700,cursor:"pointer"}}>📲 WA Permisos</button>
                              </div>

                              <div style={{fontSize:10,color:C.textoS,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:7}}>Boletas utilizadas</div>

        {/* ══ HORARIOS ══ */}
        {view==="horarios"&&(()=>{
          const lunesActual=semanaLunes(new Date());
          const grupoTemprano=grupoTempranoDeSemana(horariosConfig);
          const grupoTarde=grupoTemprano==="grupo1"?"grupo2":"grupo1";
          const sinAsignar=colabs.filter(c=>!c.grupoHorario);
          function BadgeHoras({c}){
            const h=horasSemanalesColab(c,horariosConfig);
            if(h===null)return null;
            const ok=Math.abs(h-48)<0.01;
            return<span style={{background:(ok?C.verde:C.rojo)+"20",color:ok?C.verde:C.rojo,borderRadius:20,padding:"3px 9px",fontSize:11,fontWeight:700,whiteSpace:"nowrap"}}>{ok?"✓ ":"⚠️ "}{h}h/sem</span>;
          }
          function abrirEditarColab(c){
            setColabForm({nombre:c.nombre,area:c.area,diasAcumulados:c.diasAcumulados,telefono:c.telefono||"",grupoHorario:c.grupoHorario||"",almuerzoInicio:c.almuerzoInicio||"",almuerzoFin:c.almuerzoFin||"",horarioEspecialDetalle:c.horarioEspecialDetalle||"",horarioEspecialHoras:c.horarioEspecialHoras||"",horarioEspecialDias:c.horarioEspecialDias||{}});
            setColabEdit(c.id);setShowColabForm(true);
            setAsignRapida({entrada:"",salida:"",dias:{lun:false,mar:false,mie:false,jue:false,vie:false,sab:false}});

            return(

                <div style={{fontSize:11,color:C.textoS,marginTop:10}}>La próxima semana rotan automáticamente. El café (15+15 min) no se resta ni se suma a las horas.</div>

              {/* Sub-tabs */}
              <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
                {[["grupos",`Grupos rotativos (${colabs.filter(c=>c.grupoHorario==="grupo1"||c.grupoHorario==="grupo2").length})`],["especiales",`Horario fijo especial (${colabs.filter(c=>c.grupoHorario==="especial").length})`],["sinasignar",`Sin asignar (${sinAsignar.length})`]].map(([v,label])=>(

                      </div>

            {key:"ninguno",label:"Sin grupo asignado"},

                  <div style={{marginTop:10}}>
                    <div style={{fontSize:11,color:C.textoS,marginBottom:6}}>Esta fecha no aparece como feriado oficial de Costa Rica. Si igual necesitás registrar asistencia ese día (ej. un feriado de empresa), poné un nombre:</div>
                    <input type="text" value={feriadoNombreManual} onChange={e=>setFeriadoNombreManual(e.target.value)} placeholder="Ej. Aniversario de la empresa" style={inp}/>
                  </div>

              </div>

              <div style={{background:C.g2,borderRadius:10,padding:12,marginBottom:14,border:`1px dashed ${C.g3}`}}>
                <div style={{fontSize:11,color:C.textoM,fontWeight:700,marginBottom:8}}>⚡ Registro rápido</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                  <div>
                    <div style={{fontSize:10,color:C.textoS,marginBottom:3}}>Entrada</div>
                    <input type="time" value={horaRapidaFeriado.entrada} onChange={e=>setHoraRapidaFeriado(p=>({...p,entrada:e.target.value}))} style={inp}/>

                  <div>
                    <div style={{fontSize:10,color:C.textoS,marginBottom:3}}>Salida</div>
                    <input type="time" value={horaRapidaFeriado.salida} onChange={e=>setHoraRapidaFeriado(p=>({...p,salida:e.target.value}))} style={inp}/>

                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10,flexWrap:"wrap",gap:8}}>

                    <span style={{fontSize:12,color:C.texto,fontWeight:700}}>{MESES[dbCalMonth].slice(0,3)} {dbCalYear}</span>
                    <button onClick={()=>{if(dbCalMonth===11){setDbCalMonth(0);setDbCalYear(y=>y+1);}else setDbCalMonth(m=>m+1);setDbCalDia(null);}} style={{border:"none",background:"none",color:C.naranja,fontSize:16,cursor:"pointer",fontWeight:700}}>›</button>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}}>
                  {DS.map(d=><div key={d} style={{textAlign:"center",fontSize:10,color:C.naranja,fontWeight:700,padding:"2px 0"}}>{d}</div>)}

                <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:1}}>
                  {dbCeldas.map((dia,i)=>{
                    if(!dia)return<div key={"b"+i} style={{minHeight:32}}/>;
                    const regs=regsEnDiaDB(dia);
                    const perDia=permisosEnDiaDB(dia);
                    const incDia=incapEnDiaDB(dia);
                    const tieneMarca=regs.length>0||perDia.length>0||incDia.length>0;
                    const sel=dbCalDia===dia;
                    const esHoy=hoy.getDate()===dia&&hoy.getMonth()===dbCalMonth&&hoy.getFullYear()===dbCalYear;
                    return(
                      <div key={"d"+dia} onClick={()=>setDbCalDia(sel?null:dia)} style={{minHeight:32,padding:"3px 2px",borderRadius:6,background:sel?C.naranja:esHoy?C.naranjaD+"40":"transparent",cursor:tieneMarca?"pointer":"default",outline:esHoy?"2px solid "+C.azulL:"none"}}>

                        <div style={{display:"flex",justifyContent:"center",gap:1,marginTop:1}}>
                          {regs.length>0&&<div style={{width:5,height:5,borderRadius:"50%",background:C.naranja}}/>}
                          {perDia.length>0&&<div style={{width:5,height:5,borderRadius:2,background:"#4ADE80"}}/>}
                          {incDia.length>0&&<div style={{width:5,height:5,borderRadius:"50%",background:"#C084FC"}}/>}
                        </div>
                      </div>
                    );
                  })}
                </div>
                {dbCalDia&&(()=>{
                  const regs=regsEnDiaDB(dbCalDia);
                  const perDia=permisosEnDiaDB(dbCalDia);
                  const incDia=incapEnDiaDB(dbCalDia);
                  const todos=[...regs.map(r=>({tipo:"vac",nombre:getColab(r.colabId)?.nombre||"—",det:r.estado==="reservado"?"📌 Reservado":"✓ Confirmado",col:r.estado==="reservado"?C.azulL:C.naranja})),...perDia.map(p=>({tipo:"perm",nombre:getColab(p.colabId)?.nombre||"—",det:"Permiso "+p.motivo,col:"#4ADE80"})),...incDia.map(i=>({tipo:"incap",nombre:getColab(i.colabId)?.nombre||"—",det:"Incapacidad "+i.tipo,col:"#C084FC"}))];
                  if(todos.length===0)return null;
                  return(
                    <div style={{marginTop:10,borderTop:"1px solid "+C.g2,paddingTop:8}}>
                      <div style={{fontSize:10,color:C.textoS,marginBottom:6}}>{dbCalDia} de {MESES[dbCalMonth]}</div>
                      {todos.map((t,i)=>(
                        <div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid "+C.g2}}>
                          <div style={{width:7,height:7,borderRadius:"50%",background:t.col,flexShrink:0}}/>
                          <span style={{fontSize:12,fontWeight:600,flex:1}}>{t.nombre}</span>
                          <span style={{fontSize:10,color:t.col}}>{t.det}</span>
                        </div>

                    </div>

                })()}
                <div style={{marginTop:8,display:"flex",gap:10}}>
                  <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:C.textoS}}><div style={{width:6,height:6,borderRadius:"50%",background:C.naranja}}/> Vacaciones</div>
                  <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:C.textoS}}><div style={{width:6,height:6,borderRadius:2,background:"#4ADE80"}}/> Permisos</div>
                  <div style={{display:"flex",alignItems:"center",gap:4,fontSize:10,color:C.textoS}}><div style={{width:6,height:6,borderRadius:"50%",background:"#C084FC"}}/> Incapacidad</div>
                </div>
              </div>

              {/* Próximas Vacaciones */}
              <div style={{background:C.g1,borderRadius:14,padding:16,marginBottom:16,border:"1px solid "+C.g2}}>
                <div style={{fontSize:11,color:C.verde,fontWeight:800,letterSpacing:1.5,textTransform:"uppercase",marginBottom:12}}>📋 Próximas vacaciones</div>
                {proxVac.length===0
                  ?<div style={{fontSize:13,color:C.textoS,textAlign:"center"}}>Sin vacaciones en los próximos 30 días</div>
                  :proxVac.map(r=>{
                    const c=getColab(r.colabId);
                    const col=AREA_COLOR[c?.area]||C.textoS;
                    return(
                      <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid "+C.g2}}>
                        <div style={{width:8,height:8,borderRadius:"50%",background:col,flexShrink:0}}/>
                        <div style={{flex:1}}>
                          <div style={{fontSize:13,fontWeight:600}}>{c?.nombre||"—"}</div>
                          <div style={{fontSize:11,color:C.textoS}}>{fmtDate(r.fechaInicio)} → {fmtDate(r.fechaFin)}</div>
                        </div>

                      </div>
                    );
                  })
                }
              </div>

                <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
                  {[
                    {icon:"📋",label:"Nueva vacación",action:()=>{setView("registros");setTimeout(()=>{setShowRegForm(true);setRegEdit(null);setRegForm({colabId:"",boleta:"",fechaInicio:"",fechaFin:"",mes:MESES[new Date().getMonth()],dias:"",estado:"confirmado"});setConflicto(null);},100);}},

                    {icon:"🏥",label:"Nueva incapac.",action:()=>{setView("incapacidades");setTimeout(()=>{setShowIncapForm(true);setIncapEdit(null);setIncapForm({colabId:"",fechaInicio:"",fechaFin:"",tipo:"Enfermedad",detalle:""});},100);}},
                    {icon:"⏱",label:"Tiempo extra",action:()=>{setView("permisos");setPermisoTab("extra");setTimeout(()=>{setShowExtraForm(true);setExtraEdit(null);setExtraForm({colabId:"",fecha:new Date().toISOString().split("T")[0],duracion:"",motivo:"",detalle:""});},100);}},
                    {icon:"📅",label:"Ver calendario",action:()=>setView("calendario")},

                      <span style={{fontSize:22}}>{btn.icon}</span>
                      <span style={{fontSize:10,color:C.textoM,fontWeight:600,textAlign:"center",lineHeight:1.3}}>{btn.label}</span>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          );
        })()}

        {/* ══ CAFÉ ══ */}

          <div>
            <div style={{display:"flex",gap:6,marginBottom:16}}>
              {[["control","🏃 Control"],["historial","📋 Historial"]].map(([v,label])=>(
                <button key={v} onClick={()=>setCafeView(v)} style={{padding:"7px 14px",borderRadius:8,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,background:cafeView===v?C.azul:C.g2,color:cafeView===v?C.blanco:C.textoM}}>{label}</button>
              ))}
            </div>

            {cafeView==="control"&&(
              <div>
                {enEspera.length>0&&(
                  <div style={{marginBottom:20}}>

                            <div style={{fontWeight:700,fontSize:14,color:C.amarillo}}>{c.nombre}</div>

                        </div>
                      ))}
                    </div>
                  </div>

                              <div style={{background:excedido?"#1A0505":C.g1,border:`2px solid ${excedido?C.rojo:C.naranja}`,borderRadius:12,padding:"12px 14px",display:"flex",alignItems:"center",gap:12}}>

                                  <div style={{fontWeight:700,fontSize:14,color:excedido?C.rojo:C.texto}}>{c.nombre}</div>

                                  <div style={{fontSize:13,fontWeight:800,color:excedido?C.rojo:C.amarillo,marginTop:3}}>{excedido?"⚠️ ":"⏱ "}{texto}{excedido?" — SE PASÓ":""}</div>
                                </div>
                                <button onClick={()=>regreso(c.id)} style={{padding:"9px 14px",borderRadius:10,border:"none",background:C.verde,color:C.blanco,fontSize:13,fontWeight:700,cursor:"pointer"}}>✓ Regresó</button>
                              </div>
                            )}
                          </EstadoCafe>
                        );
                      })}
                    </div>
                  </div>

                      <div key={c.id} style={{background:C.g1,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,border:`1px solid ${C.g2}`,opacity:estaAfuera||estaEspera?.5:1}}>

                          :<div style={{display:"flex",gap:6}}>
                            <button onClick={()=>salida(c.id)} style={{padding:"6px 12px",borderRadius:8,border:"none",background:C.naranja,color:C.blanco,fontSize:12,fontWeight:700,cursor:"pointer"}}>↑ Salida</button>
                            <button onClick={()=>espera(c.id)} style={{padding:"6px 12px",borderRadius:8,border:`2px solid ${C.amarillo}`,background:"transparent",color:C.amarillo,fontSize:12,fontWeight:700,cursor:"pointer"}}>⏳ Espera</button>
                          </div>
                        }
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {cafeView==="historial"&&(
              <div>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                  <div style={{fontSize:13,fontWeight:700}}>{histCafe.length} registro(s)</div>
                  {histCafe.length>0&&<button onClick={()=>setShowBorrarHist(true)} style={{padding:"6px 12px",borderRadius:8,border:`1.5px solid ${C.rojo}`,background:"transparent",color:C.rojo,fontSize:12,fontWeight:700,cursor:"pointer"}}>🗑️ Borrar todo</button>}
                </div>
                {histCafe.length===0?<Empty icon="☕" msg="Sin registros aún."/>

                    <div key={fecha} style={{marginBottom:18}}>
                      <div style={{fontSize:10,color:C.azulL,fontWeight:800,letterSpacing:1.5,textTransform:"uppercase",marginBottom:7}}>{fecha}</div>

                        {regs.map(r=>(
                          <div key={r.id} style={{background:C.g1,borderRadius:10,padding:"10px 14px",borderLeft:`4px solid ${r.excedio?C.rojo:C.naranja}`,display:"flex",alignItems:"center",gap:10}}>
                            <div style={{flex:1}}>
                              <div style={{fontWeight:600,fontSize:13}}>{r.nombre}</div>
                              <div style={{fontSize:12,color:C.textoS,marginTop:3,display:"flex",gap:12,flexWrap:"wrap"}}>
                                <span style={{color:C.naranja}}>↑ {fmtHora(r.salida)}</span>
                                <span style={{color:C.verde}}>↓ {fmtHora(r.entrada)}</span>
                                <span style={{fontWeight:700,color:r.excedio?C.rojo:C.amarillo}}>{r.excedio?"⚠️ ":"⏱ "}{r.duracion}</span>
                              </div>
                            </div>
                            <button onClick={()=>waCafe(r)} style={{padding:"6px 10px",borderRadius:8,border:"none",background:"#25D366",color:C.blanco,fontSize:11,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}}>📲 WA</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))
                }
              </div>
            )}


          </div>
        )}

        {/* ══ AUDITORÍA ══ */}

              <select value={auditFiltroTabla} onChange={e=>setAuditFiltroTabla(e.target.value)} style={{...inp,width:"auto"}}>
                <option value="Todas">Todos los módulos</option>
                {Object.keys(TABLA_LABELS).map(t=><option key={t} value={t}>{TABLA_LABELS[t]}</option>)}
              </select>
              <button onClick={cargarAuditoria} style={btnS}>{auditCargando?"Cargando...":"🔄 Refrescar"}</button>

                const ac=ACCION_LABELS[a.action]||{txt:a.action,color:C.textoM};

                const abierto=auditExpandido===a.id;

                  <div key={a.id} style={{background:C.g1,borderRadius:10,border:`1px solid ${C.g3}`,overflow:"hidden"}}>

                      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
                        <span style={{fontSize:11,fontWeight:700,color:ac.color,background:ac.color+"20",padding:"3px 8px",borderRadius:6}}>{ac.txt}</span>
                        <span style={{fontSize:13,color:C.texto,fontWeight:600}}>{TABLA_LABELS[a.table_name]||a.table_name}</span>

                      <span style={{fontSize:11,color:C.textoS}}>{fmtFecha(a.created_at)} · {fmtHora(a.created_at)}</span>

                    {abierto&&(
                      <div style={{padding:"0 14px 14px",borderTop:`1px solid ${C.g3}`}}>
                        {campos.length===0&&<div style={{fontSize:12,color:C.textoS,paddingTop:10}}>Sin detalles adicionales.</div>}
                        {campos.map(c=>(
                          <div key={c.campo} style={{fontSize:12,padding:"6px 0",borderBottom:`1px solid ${C.g2}`}}>
                            <span style={{color:C.textoM,fontWeight:700}}>{c.campo}: </span>
                            <span style={{color:C.rojo,textDecoration:"line-through"}}>{c.antes===undefined?"—":String(c.antes)}</span>

                          </div>

                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        )}

            <select value={regForm.colabId} onChange={e=>setRegForm(p=>({...p,colabId:e.target.value}))} style={inp}>

              {AREAS.map(a=><optgroup key={a} label={a}>{colabs.filter(c=>c.area===a).map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</optgroup>)}
            </select>
          </Field>
          <Field label="N° de boleta"><input value={regForm.boleta} onChange={e=>setRegForm(p=>({...p,boleta:e.target.value}))} style={inp} placeholder="Ej. 2001"/></Field>

            <Field label="Fecha inicio"><input type="date" value={regForm.fechaInicio} onChange={e=>setRegForm(p=>({...p,fechaInicio:e.target.value}))} style={inp}/></Field>
            <Field label="Fecha fin"><input type="date" value={regForm.fechaFin} onChange={e=>setRegForm(p=>({...p,fechaFin:e.target.value}))} style={inp}/></Field>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Mes"><select value={regForm.mes} onChange={e=>setRegForm(p=>({...p,mes:e.target.value}))} style={inp}>{MESES.map(m=><option key={m}>{m}</option>)}</select></Field>

                <button key={e} onClick={()=>setRegForm(p=>({...p,estado:e}))} style={{flex:1,padding:"9px",borderRadius:8,cursor:"pointer",fontSize:13,fontWeight:700,border:`2px solid ${regForm.estado===e?(e==="confirmado"?C.verde:C.azulL):C.g3}`,background:regForm.estado===e?(e==="confirmado"?"#14532D":"#1E3A5F"):"transparent",color:regForm.estado===e?(e==="confirmado"?C.verde:C.azulL):C.textoM}}>

          </Field>
          {conflicto&&(
            <div style={{background:"#1A0505",border:`1px solid ${C.rojo}`,borderRadius:8,padding:"12px 14px",fontSize:13,color:C.rojo,marginBottom:10,whiteSpace:"pre-line"}}>

      {showPermisoForm&&(
        <Modal title={permisoEdit?"Editar permiso":"Nuevo permiso especial"} onClose={resetPermisoForm}>
          <Field label="Colaborador">
            <select value={permisoForm.colabId} onChange={e=>setPermisoForm(p=>({...p,colabId:e.target.value}))} style={inp}>
              <option value="">Seleccioná un colaborador</option>
              {AREAS.map(a=><optgroup key={a} label={a}>{colabs.filter(c=>c.area===a).map(c=><option key={c.id} value={c.id}>{c.nombre}</option>)}</optgroup>)}
            </select>
          </Field>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Fecha"><input type="date" value={permisoForm.fecha} onChange={e=>setPermisoForm(p=>({...p,fecha:e.target.value}))} style={inp}/></Field>
            <Field label="Duración"><input value={permisoForm.duracion} onChange={e=>setPermisoForm(p=>({...p,duracion:e.target.value}))} style={inp} placeholder="Ej. 1h 30min"/></Field>
          </div>
          <Field label="Motivo">
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
              {MOTIVOS.map(m=>{
                const MC={Médico:C.verde,Judicial:C.amarillo,Familiar:C.naranja,Personal:C.azulL,Otro:C.textoM};
                return<button key={m} onClick={()=>setPermisoForm(p=>({...p,motivo:m}))} style={{padding:"8px",borderRadius:8,cursor:"pointer",fontSize:12,border:`2px solid ${permisoForm.motivo===m?MC[m]:C.g3}`,background:permisoForm.motivo===m?MC[m]+"20":"transparent",color:permisoForm.motivo===m?MC[m]:C.textoM,fontWeight:permisoForm.motivo===m?700:400}}>{m}</button>;
              })}
            </div>
          </Field>
          <Field label="Detalle (opcional)">
            <textarea value={permisoForm.detalle} onChange={e=>setPermisoForm(p=>({...p,detalle:e.target.value}))} style={{...inp,minHeight:70,resize:"vertical"}} placeholder="Descripción adicional..."/>
          </Field>
          <div style={{display:"flex",gap:10,marginTop:8}}><button onClick={savePermiso} style={btnA}>Guardar permiso</button><button onClick={resetPermisoForm} style={btnS}>Cancelar</button></div>
        </Modal>
      )}



      {delConfirm&&(
        <Modal title="¿Eliminar?" onClose={()=>setDelConfirm(null)}>
          <p style={{color:C.textoM,fontSize:14,marginBottom:16}}>
            {delConfirm.type==="colab"?"Se eliminará el colaborador y todos sus registros.":delConfirm.type==="reg"?"Se eliminará este registro de vacaciones.":delConfirm.type==="permiso"?"Se eliminará este permiso.":delConfirm.type==="extra"?"Se eliminará este registro de tiempo extra.":"Se eliminará esta incapacidad."}
          </p>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{
              if(delConfirm.type==="colab")eliminarColab(delConfirm.id);
              else if(delConfirm.type==="reg")eliminarReg(delConfirm.id);
              else if(delConfirm.type==="permiso")eliminarPermiso(delConfirm.id);
              else if(delConfirm.type==="extra")eliminarExtra(delConfirm.id);
              else if(delConfirm.type==="incap")eliminarIncap(delConfirm.id);
            }} style={btnD}>Sí, eliminar</button>
            <button onClick={()=>setDelConfirm(null)} style={btnS}>Cancelar</button>
          </div>
        </Modal>
      )}

      {showBorrarHist&&(
        <Modal title="¿Borrar historial de café?" onClose={()=>setShowBorrarHist(false)}>
          <p style={{color:C.textoM,fontSize:14,marginBottom:16}}>Se eliminarán todos los registros. No se puede deshacer.</p>
          <div style={{display:"flex",gap:10}}><button onClick={()=>{svHistCafe([]);setShowBorrarHist(false);}} style={btnD}>Sí, borrar todo</button><button onClick={()=>setShowBorrarHist(false)} style={btnS}>Cancelar</button></div>
        </Modal>
      )}
    </div>
  );
}

function LoginPin(){
  const [usuario,setUsuario]=useState(CUENTAS_PIN[0].email);
  const [pin,setPin]=useState("");
  const [cargando,setCargando]=useState(false);
  const [error,setError]=useState("");

  async function entrar(e){
    e.preventDefault();
    if(!pin||pin.length<6){setError("El PIN debe tener al menos 6 caracteres");return;}
    setCargando(true);setError("");
    const {error:err}=await sb.auth.signInWithPassword({email:usuario,password:pin});
    setCargando(false);
    if(err)setError("PIN incorrecto para este usuario");
  }

  return(
    <div style={{minHeight:"100vh",background:C.negro,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <form onSubmit={entrar} style={{width:"100%",maxWidth:320,background:C.g1,borderRadius:14,padding:28,border:`1px solid ${C.g3}`}}>
        <div style={{fontSize:20,fontWeight:800,color:C.blanco,marginBottom:4,textAlign:"center"}}>Control Empresarial</div>
        <div style={{fontSize:12,color:C.textoM,marginBottom:22,textAlign:"center"}}>Elegí tu usuario e ingresá tu PIN</div>

        <div style={{fontSize:11,color:C.textoM,fontWeight:700,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>Usuario</div>
        <select
          value={usuario}
          onChange={e=>{setUsuario(e.target.value);setError("");}}
          style={{width:"100%",padding:"11px 14px",borderRadius:10,border:`1.5px solid ${C.g3}`,fontSize:14,color:C.texto,background:C.g2,boxSizing:"border-box",marginBottom:14}}
        >
          {CUENTAS_PIN.map(c=><option key={c.email} value={c.email}>{c.nombre}</option>)}
        </select>

        <div style={{fontSize:11,color:C.textoM,fontWeight:700,marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>PIN</div>
        <input
          type="password"
          inputMode="numeric"
          autoFocus
          value={pin}
          onChange={e=>{setPin(e.target.value);setError("");}}
          placeholder="PIN"
          style={{width:"100%",padding:"12px 14px",borderRadius:10,border:`1.5px solid ${error?C.rojo:C.g3}`,fontSize:18,letterSpacing:4,textAlign:"center",color:C.texto,background:C.g2,boxSizing:"border-box",marginBottom:14}}
        />
        {error&&<div style={{color:C.rojo,fontSize:12,textAlign:"center",marginBottom:14}}>{error}</div>}
        <button type="submit" disabled={cargando} style={{width:"100%",padding:"11px",borderRadius:10,border:"none",background:C.naranja,color:C.blanco,fontSize:14,fontWeight:700,cursor:cargando?"default":"pointer",opacity:cargando?.6:1}}>
          {cargando?"Verificando...":"Entrar"}
        </button>
      </form>
    </div>
  );
}

function Modal({title,onClose,children}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:100,padding:16}}>
      <div style={{background:"#111827",borderRadius:14,padding:20,width:"100%",maxWidth:480,maxHeight:"92vh",overflowY:"auto",border:"1px solid #374151"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div style={{fontWeight:800,fontSize:15,color:"#F1F5F9"}}>{title}</div>
          <button onClick={onClose} style={{border:"none",background:"none",fontSize:22,cursor:"pointer",color:"#F97316",lineHeight:1}}>×</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({label,children}){
  return(
    <div style={{marginBottom:14}}>
      <label style={{display:"block",fontSize:10,fontWeight:700,color:"#94A3B8",marginBottom:6,textTransform:"uppercase",letterSpacing:1}}>{label}</label>
      {children}
    </div>
  );
}

function EstadoCafe({salida,children}){
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{
    const t=setInterval(()=>setNow(Date.now()),1000);
    return()=>clearInterval(t);
  },[]);
  const ms=now-salida;
  const excedido=ms>LIMITE_CAFE*60*1000;
  const m=Math.floor(ms/60000),s=Math.floor((ms%60000)/1000);
  const texto=`${m}m ${s.toString().padStart(2,"0")}s`;
  return children({excedido,texto});
}

function Empty({icon,msg}){
  return<div style={{textAlign:"center",padding:"48px 24px",color:"#64748B"}}><div style={{fontSize:36,marginBottom:10}}>{icon}</div>{msg}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
